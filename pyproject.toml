[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-classifier"
version = "0.1.0"
description = "Classify business documents by type from text and layout features, with a training CLI and calibrated confidence output."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Prabesh Sharma" }]
keywords = ["classification", "naive-bayes", "calibration", "ml", "documents", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
doc-classifier = "doc_classifier.cli:main"

[project.urls]
Homepage = "https://github.com/hellpuffyt/doc-classifier"
Issues = "https://github.com/hellpuffyt/doc-classifier/issues"
Changelog = "https://github.com/hellpuffyt/doc-classifier/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["doc_classifier"]

[tool.coverage.report]
show_missing = true
