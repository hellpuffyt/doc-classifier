name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy (strict)
        run: mypy

      - name: coverage floor
        run: pytest -q --cov --cov-fail-under=95

  train-and-eval-the-example:
    name: train, classify and eval the bundled example end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: python -m pip install --upgrade pip && pip install -e .

      # A real train -> classify -> eval round trip, with the results
      # asserted exactly rather than just "ran without crashing": the
      # example is small and separable enough that perfect self-accuracy
      # and a specific predicted label are the honest, checkable outcome.
      - name: exact results, not just exit codes
        run: |
          set -euo pipefail
          doc-classifier train examples/documents.jsonl --out /tmp/model.json
          doc-classifier classify --model /tmp/model.json \
            "INVOICE #9001 Bill To: Acme Amount Due: \$500.00 remit payment to accounts payable" \
            --format json | python -c "
          import json, sys
          payload = json.load(sys.stdin)
          assert payload['label'] == 'invoice', payload
          assert payload['confidence'] > 0.5, payload
          print('classification matches the documented example')
          "
          eval_code=0
          doc-classifier eval --model /tmp/model.json examples/documents.jsonl \
            --format json --min-accuracy 1.0 > /tmp/eval.json || eval_code=$?
          test "$eval_code" = "0"
          python -c "
          import json
          payload = json.load(open('/tmp/eval.json'))
          assert payload['accuracy'] == 1.0, payload
          assert payload['expected_calibration_error'] < 0.05, payload
          print('eval matches the documented example: perfect accuracy, low ECE')
          "

      - name: zero runtime dependencies
        run: |
          set -euo pipefail
          python - <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              deps = tomllib.load(fh)["project"]["dependencies"]
          assert deps == [], f"runtime dependencies declared: {deps}"
          print("dependencies = [] holds")
          EOF
